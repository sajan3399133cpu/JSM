<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JSM AI V100 - Premium 30+ Min Video Studio</title>
    <style>
        :root {
            --gold-primary: #D4AF37;
            --gold-light: #FFDF00;
            --gold-dark: #AA771C;
            --bg-black: #08080a;
            --panel-bg: #0f0e0a;
        }

        body {
            background-color: var(--bg-black);
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 10px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 480px;
            background: var(--panel-bg);
            border: 2px solid var(--gold-primary);
            border-radius: 12px;
            padding: 15px;
            box-shadow: 0 0 25px rgba(212, 175, 55, 0.25);
            box-sizing: border-box;
        }

        .header {
            text-align: center;
            border-bottom: 1px solid var(--gold-dark);
            padding-bottom: 10px;
            margin-bottom: 15px;
        }

        .header h1 {
            color: var(--gold-light);
            font-size: 18px;
            margin: 0;
            text-shadow: 0 0 8px rgba(255, 223, 0, 0.5);
        }

        .section-box {
            background: rgba(0, 0, 0, 0.6);
            border: 1px solid var(--gold-dark);
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 12px;
        }

        .section-title {
            color: var(--gold-primary);
            font-weight: bold;
            margin-bottom: 8px;
            font-size: 14px;
            display: block;
            text-align: center;
        }

        textarea {
            width: 100%;
            height: 90px;
            background: #121215;
            border: 1px solid var(--gold-primary);
            color: #fff;
            padding: 8px;
            border-radius: 6px;
            box-sizing: border-box;
            resize: vertical;
            font-size: 13px;
        }

        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        select, input[type="text"] {
            width: 100%;
            padding: 8px;
            background: #121215;
            border: 1px solid var(--gold-dark);
            color: var(--gold-primary);
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 12px;
        }

        .drop-zone {
            border: 1.5px dashed var(--gold-primary);
            padding: 15px;
            text-align: center;
            border-radius: 6px;
            background: rgba(212, 175, 55, 0.05);
            cursor: pointer;
            font-size: 12px;
            color: #ddd;
        }

        .btn-generate {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #FFDF00, #D4AF37, #AA771C);
            border: none;
            color: #000;
            font-weight: bold;
            font-size: 16px;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 0 10px rgba(255, 223, 0, 0.4);
            transition: 0.2s;
        }

        .btn-generate:hover {
            transform: scale(1.02);
        }

        .status {
            text-align: center;
            margin-top: 12px;
            color: #00ffcc;
            font-weight: bold;
            font-size: 14px;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>JSM AI V100 - Premium 👑<br>30+ Min Video Studio</h1>
    </div>

    <!-- Script Input -->
    <div class="section-box">
        <label class="section-title">(Script) جز ویڈیو والا اسکرپٹ</label>
        <textarea id="scriptInput" placeholder="یہاں اپنا اسکرپٹ درج کریں... (25-30 منٹ کی ویڈیو کے لیے لمبا اسکرپٹ پیسٹ کریں)"></textarea>
    </div>

    <!-- Options Grid -->
    <div class="grid-2">
        <!-- Video Duration -->
        <div class="section-box">
            <label class="section-title">ویڈیو کی لمبائی</label>
            <select id="videoDuration">
                <option value="unwan">(Al Unwan) 25-30 Min</option>
                <option value="15">15 Min Full Video</option>
                <option value="5">5 Min Medium</option>
                <option value="short">Shorts / Reel (1 Min)</option>
            </select>
        </div>

        <!-- Language Selection (30+ Languages) -->
        <div class="section-box">
            <label class="section-title">زبان کا انتخاب کریں (30+ Languages)</label>
            <select id="voiceLang">
                <option value="ur-PK-AsadNeural">Urdu (اردو)</option>
                <option value="en-US-BrandonNeural">English (UK/US)</option>
                <option value="hi-IN-ArjunNeural">Hindi (हिंदी)</option>
                <option value="ar-SA-HamedNeural">Arabic (عربي)</option>
                <option value="zh-CN-YunxiNeural">Chinese (Mandarin)</option>
                <option value="es-ES-AlvaroNeural">Spanish</option>
                <option value="fr-FR-HenriNeural">French</option>
                <option value="de-DE-KillianNeural">German</option>
                <option value="ja-JP-KeitaNeural">Japanese</option>
                <option value="ru-RU-DmitryNeural">Russian</option>
                <option value="pt-BR-AntonioNeural">Portuguese</option>
                <option value="tr-TR-AhmetNeural">Turkish</option>
                <option value="fa-IR-FaridNeural">Persian (فارسی)</option>
                <option value="it-IT-DiegoNeural">Italian</option>
                <option value="ko-KR-InJoonNeural">Korean</option>
            </select>
        </div>
    </div>

    <!-- Video Mode & Stock Drop -->
    <div class="section-box">
        <label class="section-title">(Drag & Drop) فری اسٹاک ویڈیو</label>
        <div class="drop-zone" onclick="document.getElementById('videoFile').click()">
            <span id="fileLabel">اپنی فری اسٹاک ویڈیو یہاں ڈریگ اینڈ ڈراپ کریں یا سلیکٹ کریں</span>
            <input type="file" id="videoFile" accept="video/*" style="display:none" onchange="updateFileName(this)">
        </div>
        <div style="margin-top: 8px;">
            <select id="videoMode">
                <option value="Free Stock Videos">Free Stock Videos (Pexels)</option>
                <option value="Image To Motion Video">AI Image To Motion Video</option>
            </select>
        </div>
    </div>

    <!-- Topic / Niche -->
    <div class="section-box">
        <label class="section-title">(Topic / Niche) موضوع / نِش</label>
        <input type="text" id="nicheInput" placeholder="مثلاً: Autonomous Driving, Finance, Motivation...">
    </div>

    <!-- Submit Button -->
    <button class="btn-generate" onclick="generateVideo()">🚀 ویڈیو بناؤ (Generate Video)</button>

    <div class="status" id="statusBox">Ready</div>
</div>

<script>
    function updateFileName(input) {
        if (input.files && input.files[0]) {
            document.getElementById('fileLabel').innerText = "سلیکٹ شدہ فائل: " + input.files[0].name;
        }
    }

    async function generateVideo() {
        const script = document.getElementById('scriptInput').value;
        const voice = document.getElementById('voiceLang').value;
        const mode = document.getElementById('videoMode').value;
        const status = document.getElementById('statusBox');

        if (!script.trim()) {
            alert('براہ کرم پہلے اسکرپٹ لکھیے!');
            return;
        }

        status.innerText = "⏳ ریکویسٹ بھیج دی گئی ہے... بیک اینڈ ویڈیو پروسیسنگ شروع کر رہا ہے!";

        // GitHub Repository Dispatch Trigger
        const GITHUB_REPO = "sajan3399133cpu/JSM";
        
        try {
            const res = await fetch(`https://api.github.com/repos/${GITHUB_REPO}/dispatches`, {
                method: 'POST',
                headers: {
                    'Accept': 'application/vnd.github.v3+json',
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    event_type: 'generate_video',
                    client_payload: {
                        script: script,
                        voice: voice,
                        mode: mode
                    }
                })
            });

            if (res.status === 204 || res.ok) {
                status.innerText = "🚀 ویڈیو جنریشن کا عمل شروع ہو گیا ہے! ویڈیو تیار ہوتے ہی ڈاؤن لوڈ ہو جائے گی۔";
            } else {
                status.innerText = "⚡ ویڈیو پراسیسنگ کا سگنل بھیج دیا گیا ہے۔";
            }
        } catch (err) {
            status.innerText = "❌ ریکویسٹ بھیجنے میں مسئلہ آیا!";
            console.error(err);
        }
    }
</script>
</body>
                </html>
