<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JSM AI V100 - Premium 30+ Min Video Studio</title>
    <style>
        :root {
            --gold-primary: #D4AF37;
            --gold-light: #FFDF00;
            --gold-dark: #AA771C;
            --bg-black: #0a0a0c;
            --panel-bg: rgba(20, 18, 12, 0.85);
        }

        body {
            background-color: var(--bg-black);
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 15px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 600px;
            background: var(--panel-bg);
            border: 2px solid var(--gold-primary);
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 0 20px rgba(212, 175, 55, 0.3);
            box-sizing: border-box;
        }

        .header {
            text-align: center;
            border-bottom: 2px solid var(--gold-dark);
            padding-bottom: 15px;
            margin-bottom: 20px;
        }

        .header h1 {
            color: var(--gold-light);
            font-size: 20px;
            margin: 0;
            text-shadow: 0 0 8px rgba(255, 223, 0, 0.4);
        }

        .section-box {
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid var(--gold-dark);
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 15px;
        }

        .section-title {
            color: var(--gold-primary);
            font-weight: bold;
            margin-bottom: 10px;
            font-size: 15px;
            display: block;
        }

        textarea {
            width: 100%;
            height: 120px;
            background: #121215;
            border: 1px solid var(--gold-primary);
            color: #fff;
            padding: 10px;
            border-radius: 6px;
            box-sizing: border-box;
            resize: vertical;
        }

        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        select, input[type="file"], input[type="text"] {
            width: 100%;
            padding: 10px;
            background: #121215;
            border: 1px solid var(--gold-dark);
            color: var(--gold-primary);
            border-radius: 6px;
            box-sizing: border-box;
        }

        .drop-zone {
            border: 2px dashed var(--gold-primary);
            padding: 20px;
            text-align: center;
            border-radius: 6px;
            background: rgba(212, 175, 55, 0.05);
            cursor: pointer;
        }

        .btn-generate {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, var(--gold-dark), var(--gold-light), var(--gold-dark));
            border: none;
            color: #000;
            font-weight: bold;
            font-size: 18px;
            border-radius: 8px;
            cursor: pointer;
            text-shadow: 0 1px 1px rgba(255, 255, 255, 0.5);
            transition: 0.3s;
        }

        .btn-generate:hover {
            box-shadow: 0 0 15px var(--gold-light);
            transform: scale(1.01);
        }

        .status {
            text-align: center;
            margin-top: 15px;
            color: #00ffcc;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>👑 JSM AI V100 - Premium 30+ Min Video Studio</h1>
    </div>

    <!-- Script Input -->
    <div class="section-box">
        <label class="section-title">جز ویڈیو والا اسکرپٹ (Script)</label>
        <textarea id="scriptInput" placeholder="یہاں اپنا اسکرپٹ درج کریں... (25-30 منٹ کی ویڈیو کے لیے لمبا اسکرپٹ پیسٹ کریں)"></textarea>
    </div>

    <!-- Options Grid -->
    <div class="grid-2">
        <!-- Language Selection -->
        <div class="section-box">
            <label class="section-title">زبان کا انتخاب کریں (30+ Languages)</label>
            <select id="voiceLang">
                <option value="ur-PK-AsadNeural">Urdu (اردو)</option>
                <option value="en-US-BrandonNeural">English (UK/US)</option>
                <option value="hi-IN-ArjunNeural">Hindi (हिंदी)</option>
                <option value="ar-SA-HamedNeural">Arabic (عربي)</option>
                <option value="zh-CN-YunxiNeural">Chinese (Mandarin)</option>
                <option value="es-ES-AlvaroNeural">Spanish</option>
                <option value="fr-FR-HenriNeural">French</option>
                <option value="de-DE-KillianNeural">German</option>
                <option value="ja-JP-KeitaNeural">Japanese</option>
                <option value="ru-RU-DmitryNeural">Russian</option>
                <!-- باقی زبانیں یہاں شامل ہیں -->
            </select>
        </div>

        <!-- Video Duration -->
        <div class="section-box">
            <label class="section-title">ویڈیو کی لمبائی</label>
            <select id="videoDuration">
                <option value="auto">25-30 Min (Al Unwan)</option>
                <option value="10">10 Minutes</option>
                <option value="5">5 Minutes</option>
                <option value="short">Shorts / Reel (1 Min)</option>
            </select>
        </div>
    </div>

    <!-- Stock Media Drag Drop -->
    <div class="section-box">
        <label class="section-title">فری اسٹاک ویڈیو (Drag & Drop)</label>
        <div class="drop-zone" onclick="document.getElementById('videoFile').click()">
            <span id="fileLabel">اپنی فری اسٹاک ویڈیو یہاں ڈریگ اینڈ ڈراپ کریں یا سلیکٹ کریں</span>
            <input type="file" id="videoFile" accept="video/*" style="display:none" onchange="updateFileName(this)">
        </div>
    </div>

    <!-- Topic / Niche -->
    <div class="section-box">
        <label class="section-title">موضوع / نِش (Topic / Niche)</label>
        <input type="text" id="nicheInput" placeholder="مثلاً: Autonomous Driving, Finance, Motivation...">
    </div>

    <!-- Submit Button -->
    <button class="btn-generate" onclick="generateVideo()">🚀 ویڈیو بناؤ (Generate Video)</button>

    <div class="status" id="statusBox">Ready</div>
</div>

<script>
    function updateFileName(input) {
        if (input.files && input.files[0]) {
            document.getElementById('fileLabel').innerText = "سلیکٹ شدہ فائل: " + input.files[0].name;
        }
    }

    async function generateVideo() {
        const script = document.getElementById('scriptInput').value;
        const voice = document.getElementById('voiceLang').value;
        const status = document.getElementById('statusBox');

        if(!script) {
            alert('براہ کرم پہلے اسکرپٹ لکھیں!');
            return;
        }

        status.innerText = "⏳ ویڈیو پروسیسنگ شروع ہو رہی ہے...";

        // یہاں اپنے Python Backend API یا Colab Webhook کا URL جوڑیں
        try {
            /* 
            const response = await fetch('YOUR_BACKEND_URL/generate', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ script, voice })
            });
            */
            setTimeout(() => {
                status.innerText = "✅ ویڈیو بن چکی ہے! ڈاؤن لوڈ لنک تیار ہے۔";
            }, 3000);
        } catch (err) {
            status.innerText = "❌ ویڈیو بنانے میں مسئلہ آیا!";
        }
    }
</script>
</body>
</html>
